name: Recover stale Pages deployment
on:
  push:
    branches: [fix/pages-recovery-e50e8cc]
    paths: [.github/workflows/recover-stale-pages.yml]
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const args = {owner: context.repo.owner, repo: context.repo.repo, deploymentId: 'f75c5d57fb60b765a9c681d85d4441aefdf126fc'};
            const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', args);
            core.info('Old deployment status: ' + result.data.status);
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', args);
            core.info('Cancellation requested for the old deployment blocking release 2026.11.01.3.');
