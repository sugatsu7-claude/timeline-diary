name: Check PWA release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm ci --ignore-scripts
        working-directory: worker
      - run: npm run check
        working-directory: worker
      - run: npx wrangler deploy --dry-run
        working-directory: worker
      - run: node tests/motion.test.cjs
        env:
          DIARY_BROWSER: webkit
      - run: npm test
      - run: node tests/editor-layout.test.cjs
        env:
          DIARY_BROWSER: webkit
      - run: node tests/map-picker.test.cjs
        env:
          DIARY_BROWSER: webkit
      - run: node tests/photo-strip.test.cjs
        env:
          DIARY_BROWSER: webkit
      - run: python scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-diary-release
          path: dist/
